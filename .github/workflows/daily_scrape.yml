name: Daily Stock Scrape

on:
  schedule:
    # Run at 10:00 UTC (6:00 PM Philippines Time) every weekday
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Limit permissions to writing contents

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Refresh Metadata Weekly
      run: |
        if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          python scrape_pse_metadata.py
        else
          echo "Skipping metadata refresh; weekly run is Monday UTC."
        fi

    - name: Validate Industry Metadata
      run: python validate_industries.py

    - name: Run Technical Analysis Scraper
      run: python main.py

    - name: Run Fundamental Data Scraper
      run: python fetch_pse_fundamentals.py

    - name: Run Strategy Backtests
      run: |
        python backtest.py --objective monthly_gain --months 3
        python backtest.py --objective base --months 3

    - name: Refresh Action Outcomes
      run: python action_outcomes.py

    - name: Generate Daily Action Plan
      run: python action_engine.py

    - name: Track Action Outcomes
      run: python action_outcomes.py

    - name: Send Daily Action Digest
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python notify_actions.py

    - name: Generate Dashboard Report
      run: |
        python regenerate_report.py
        cp report.html index.html

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: daily data refresh [skip ci]"
        file_pattern: 'data/*.json report.html index.html backtest_results_*.md daily_actions.md'
